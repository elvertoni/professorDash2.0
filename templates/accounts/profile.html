{% extends 'accounts/profile_base.html' %}

{% block profile_content %}
<div class="section-heading compact">
    <h2>Perfil</h2>
    <p>Dados principais da sua conta.</p>
</div>
<article class="card">
    <div class="card-head">
        <span class="chip">Identidade</span>
    </div>
    <h3>{{ request.user.nome_completo }}</h3>
    <p class="desc">{{ request.user.email }}</p>
</article>
{% endblock %}
